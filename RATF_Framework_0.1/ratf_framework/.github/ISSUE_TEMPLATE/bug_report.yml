name: Bug report
description: Laporkan perilaku R-ATF yang dapat direproduksi
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Versi R-ATF
      placeholder: 0.1.1
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Perilaku yang ditemukan
      description: Jangan masukkan token, secret, atau data pengguna.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Langkah reproduksi minimum
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Hasil yang diharapkan
    validations:
      required: true
